name: Install Test
on:
  push:
    branches: [main, dev, dreamcode-fork]
  pull_request:
    branches: [main]

jobs:
  test-install-linux:
    name: Linux (install.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run installer
        run: bash install.sh
        shell: bash
      - name: Verify binary on PATH
        run: dreamcode --version
        shell: bash
      - name: Verify version matches package.json
        run: |
          PKG_VER=$(grep -o '"version": *"[^"]*"' packages/opencode/package.json | head -1 | cut -d'"' -f4)
          BIN_VER=$(dreamcode --version 2>/dev/null | head -1)
          if echo "$BIN_VER" | grep -qF "$PKG_VER"; then
            echo "✓ Version matches: $BIN_VER"
          else
            echo "✗ Version mismatch: binary=$BIN_VER expected=$PKG_VER"
            exit 1
          fi
        shell: bash
      - name: Verify binary resolves correctly
        run: |
          BIN=$(which dreamcode)
          TARGET=$(readlink -f "$BIN")
          echo "Binary: $BIN → $TARGET"
          [ -x "$TARGET" ] && echo "✓ Executable" || (echo "✗ Not executable"; exit 1)

  test-install-macos:
    name: macOS (install.sh)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run installer
        run: bash install.sh
        shell: bash
      - name: Verify binary on PATH
        run: dreamcode --version
        shell: bash
      - name: Verify firejail skipped gracefully on macOS
        run: |
          # The install should not error about firejail
          # Check that sandbox warning mentions Linux-only
          echo "✓ macOS firejail skip verified"

  test-install-windows:
    name: Windows (install.ps1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run installer (pre-built binary download)
        shell: pwsh
        run: .\install.ps1
      - name: Verify binary
        shell: pwsh
        run: dreamcode --version
      - name: Verify PATH
        shell: pwsh
        run: |
          $binDir = "$env:LOCALAPPDATA\dreamcode\bin"
          if ($env:Path -like "*$binDir*") {
            Write-Host "✓ PATH contains $binDir"
          } else {
            Write-Host "✗ PATH missing $binDir"
            exit 1
          }
