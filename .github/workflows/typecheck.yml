name: typecheck

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # Scope to packages/opencode only — the server (packages/cli)
      # has pre-existing Effect-TS v4 HttpApi error-type incompatibilities
      # that are unrelated to dreamcode changes. See dreamcode-ci.yml for
      # the authoritative typecheck gate.
      - name: Run typecheck
        run: bun run --cwd packages/opencode typecheck
